<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Frontend Developer banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.45" stop-color="#0b1c2c"/>
      <stop offset="1" stop-color="#0f3a4f"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#4aa8c9" opacity="0.35"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dotmask">
      <rect width="1280" height="320" fill="url(#fade)"/>
    </mask>
  </defs>

  <rect width="1280" height="320" rx="10" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="10" fill="url(#dots)" mask="url(#dotmask)"/>

  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="15" fill="#5f8fa8" opacity="0.35">
    <text x="300" y="70">const App = () =&gt; {</text>
    <text x="320" y="95">const [state, setState] = useState(null);</text>
    <text x="320" y="120">return &lt;Interface data={state} /&gt;;</text>
    <text x="300" y="145">};</text>
  </g>

  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" text-anchor="end">
    <text x="1210" y="135" font-size="52" font-weight="700" fill="#ffffff">Frontend Developer</text>
    <rect x="1020" y="152" width="190" height="4" rx="2" fill="#3de0b5"/>
    <text x="1210" y="203" font-size="24" fill="#cfe3ee">React · TypeScript · JavaScript · HTML · CSS</text>
    <text x="1210" y="241" font-size="22" fill="#8fb3c4">Git · GitHub · Vite · Ubuntu</text>
  </g>

  <rect x="825" y="262" width="385" height="34" rx="17" fill="none" stroke="#3de0b5" stroke-width="1.5"/>
  <text x="1017" y="285" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" fill="#bfeedd" text-anchor="middle">Tashkent · UTC+5 · github.com/rus1amturdaliev</text>
</svg>
